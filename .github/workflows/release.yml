# Builds what people download: the `todo` command, the Linux app, the Android
# app and the GNOME extension. A tag like v0.2.0 publishes them as a GitHub
# Release; a pull request that touches this file only builds them, as a check.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  linux:
    # The oldest runner on offer, so the programs start on older systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: The todo command
        working-directory: cli
        run: |
          dart pub get
          dart build cli
          tar -czf "$GITHUB_WORKSPACE/todo-cli-linux-x64.tar.gz" -C build/cli/linux_x64 bundle

      - name: The desktop app
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build linux --release
          cp ../../assets/logo.svg build/linux/x64/release/bundle/todo.svg
          tar -czf "$GITHUB_WORKSPACE/todo-app-linux-x64.tar.gz" -C build/linux/x64/release bundle

      - name: The GNOME extension
        # metadata.json at the top of the archive, as `gnome-extensions install` wants.
        run: (cd gnome-extension/todo@atharv.local && zip -qr "$GITHUB_WORKSPACE/todo-gnome-extension.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            todo-cli-linux-x64.tar.gz
            todo-app-linux-x64.tar.gz
            todo-gnome-extension.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # With the four ANDROID_* secrets set, every release is signed with the
      # same key and installs over the last one. Without them the build is
      # signed with a throwaway key and has to be installed fresh each time.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No signing key set; this APK cannot update an installed one."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > apps/app/android/key.properties

      - name: The Android app
        working-directory: apps/app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/todo-android-arm64.apk"
          cp app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/todo-android-arm32.apk"
          cp app-x86_64-release.apk "$GITHUB_WORKSPACE/todo-android-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: todo-android-*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            todo-cli-linux-x64.tar.gz todo-app-linux-x64.tar.gz todo-gnome-extension.zip todo-android-*.apk
